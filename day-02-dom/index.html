<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Finance Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>💰 JS Finance Tracker</h1>

        <section class="summery">
            <div class="card">
                <h3>Balance</h3>
                <p id="balance">Rs.0</p>
            </div>

            <div class="card">
                <h3>Income</h3>
                <p id="income">Rs. 0</p>
            </div>

            <div class="card">
                <h3>Expenses</h3>
                <p id="expenses">Rs. 0</p>
            </div>
        </section>
        <section>

            <h2>Transactions</h2>

            <div id="transaction-list">
            </div>

        </section>
        <script src="js/app.js"></script>
    </div>

</body>

</html>
