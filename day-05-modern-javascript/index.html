<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Finance Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>💰 JS Finance Tracker</h1>

        <!-- ========================= -->
        <!-- Summary -->
        <!-- ========================= -->

        <section class="summery">
            <div class="card">
                <h3>Balance</h3>
                <p id="balance">Rs.0</p>
            </div>

            <div class="card">
                <h3>Income</h3>
                <p id="income">Rs. 0</p>
            </div>

            <div class="card">
                <h3>Expenses</h3>
                <p id="expenses">Rs. 0</p>
            </div>
        </section>

        <!-- ========================= -->
        <!-- Add Transaction Form -->
        <!-- ========================= -->

        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transaction-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="Example: Food">
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Example: 12000">

                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type">
                        <option value="">Select transaction type</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="Example: Food">
                </div>

                <p id="error-message"></p>

                <button type="submit" id="submit-button">
                    Add Transaction
                </button>

                <button type="button" id="cancel-button" hidden>
                    Cancel
                </button>
            </form>
        </section>

        <!-- ========================= -->
        <!-- Transactions -->
        <!-- ========================= -->

        <section>

            <h2>Transactions</h2>

            <div id="transaction-list">
            </div>

        </section>
        <script src="js/app.js"></script>
    </div>

</body>

</html>
